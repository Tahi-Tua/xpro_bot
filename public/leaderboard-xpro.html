<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>XPRO Member Leaderboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #050914;
    }

    body {
      min-height: 100vh;
      color: #fff;
      padding: 22px 12px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 5%, rgba(0, 255, 209, .22), transparent 32%),
        radial-gradient(circle at 88% 92%, rgba(124, 58, 237, .26), transparent 38%),
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, .12), transparent 42%),
        linear-gradient(145deg, #06131f 0%, #081120 42%, #0b1020 72%, #070914 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 82px 82px;
      mask-image: radial-gradient(circle at center, black, transparent 74%);
      opacity: .55;
    }

    .container {
      width: min(100%, 1080px);
      margin: auto;
      position: relative;
      padding: clamp(22px, 4vw, 54px);
      border-radius: 34px;
      background:
        linear-gradient(180deg, rgba(8, 18, 35, .82), rgba(8, 12, 28, .92)),
        radial-gradient(circle at top left, rgba(45, 212, 191, .18), transparent 42%),
        radial-gradient(circle at bottom right, rgba(124, 58, 237, .22), transparent 44%);
      border: 1px solid rgba(148, 163, 184, .16);
      box-shadow:
        0 36px 110px rgba(0, 0, 0, .58),
        inset 0 1px 0 rgba(255, 255, 255, .05);
      overflow: hidden;
    }

    .container::before,
    .container::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: 999px;
      filter: blur(18px);
    }

    .container::before {
      width: 360px;
      height: 360px;
      top: -190px;
      left: -130px;
      background: rgba(45, 212, 191, .22);
    }

    .container::after {
      width: 420px;
      height: 420px;
      right: -190px;
      bottom: -230px;
      background: rgba(124, 58, 237, .26);
    }

    .header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: clamp(26px, 5vw, 58px);
    }

    .header h1 {
      font-size: clamp(3.15rem, 8.5vw, 6.6rem);
      line-height: .92;
      font-weight: 1000;
      letter-spacing: clamp(4px, 1.1vw, 14px);
      background: linear-gradient(90deg, #28d7ff 0%, #5e7cff 32%, #9a4dff 57%, #f59ac8 78%, #ffb84d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      text-shadow: 0 0 34px rgba(56, 189, 248, .18);
      filter: drop-shadow(0 18px 36px rgba(0, 0, 0, .30));
    }

    .header p {
      margin-top: 20px;
      color: rgba(226, 232, 240, .88);
      font-size: clamp(1.28rem, 3.8vw, 2.85rem);
      font-weight: 500;
      letter-spacing: .01em;
    }

    .scoreboard {
      position: relative;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(15, 23, 42, .80), rgba(8, 13, 30, .86));
      backdrop-filter: blur(22px);
      border: 1px solid rgba(148, 163, 184, .20);
      border-radius: clamp(24px, 4vw, 38px);
      overflow: hidden;
      box-shadow:
        0 34px 90px rgba(0, 0, 0, .42),
        inset 0 1px 0 rgba(255, 255, 255, .05),
        0 0 0 1px rgba(56, 189, 248, .045);
    }

    .table-header,
    .player-row {
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) 210px;
      align-items: center;
      gap: 18px;
      padding-inline: clamp(20px, 4vw, 48px);
    }

    .table-header {
      min-height: clamp(70px, 9vw, 118px);
      background: linear-gradient(90deg, rgba(15, 23, 42, .96), rgba(30, 41, 59, .78));
      color: rgba(226, 232, 240, .72);
      text-transform: uppercase;
      font-size: clamp(1rem, 2.6vw, 1.9rem);
      font-weight: 950;
      letter-spacing: clamp(2px, .8vw, 9px);
      border-bottom: 1px solid rgba(148, 163, 184, .22);
    }

    .player-row {
      min-height: clamp(72px, 10vw, 132px);
      border-bottom: 1px solid rgba(148, 163, 184, .08);
      position: relative;
      isolation: isolate;
      transition: transform .28s ease, filter .28s ease, background .28s ease;
      background:
        linear-gradient(90deg, rgba(15, 23, 42, .72), rgba(15, 23, 42, .44));
    }

    .player-row::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0;
      background: linear-gradient(90deg, rgba(56, 189, 248, .11), transparent 64%);
      transition: opacity .28s ease;
    }

    .player-row:hover {
      transform: translateY(-2px) scale(1.006);
      filter: brightness(1.08);
    }

    .player-row:hover::before {
      opacity: 1;
    }

    .player-row:last-child {
      border-bottom: none;
    }

    .rank {
      font-weight: 1000;
      font-size: clamp(1.25rem, 3.8vw, 2.75rem);
      color: #f8fafc;
      text-shadow: 0 6px 18px rgba(0, 0, 0, .35);
      white-space: nowrap;
    }

    .name {
      min-width: 0;
      font-weight: 950;
      font-size: clamp(1.08rem, 3.2vw, 2.45rem);
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 8px 18px rgba(0, 0, 0, .34);
    }

    .score {
      text-align: right;
      font-weight: 1000;
      font-size: clamp(1.12rem, 3.2vw, 2.35rem);
      color: #38bdf8;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: clamp(92px, 19vw, 176px);
      min-height: clamp(42px, 7vw, 78px);
      padding: 8px clamp(16px, 3vw, 30px);
      border-radius: 999px;
      color: #38d8ff;
      background:
        linear-gradient(180deg, rgba(56, 189, 248, .26), rgba(14, 165, 233, .12));
      border: 1px solid rgba(56, 189, 248, .42);
      text-align: center;
      font-variant-numeric: tabular-nums;
      box-shadow:
        0 0 22px rgba(56, 189, 248, .18),
        inset 0 1px 0 rgba(255, 255, 255, .13),
        inset 0 -10px 22px rgba(2, 132, 199, .10);
    }

    .top-1 {
      background:
        linear-gradient(90deg, rgba(255, 215, 0, .30), rgba(15, 23, 42, .50) 62%, rgba(15, 23, 42, .38));
      box-shadow: inset 4px 0 0 rgba(255, 215, 0, .80), inset 0 0 38px rgba(255, 215, 0, .08);
    }

    .top-1::after,
    .top-2::after,
    .top-3::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .55;
    }

    .top-1::after {
      background: radial-gradient(circle at 18% 50%, rgba(255, 215, 0, .18), transparent 34%);
    }

    .top-2 {
      background:
        linear-gradient(90deg, rgba(226, 232, 240, .24), rgba(15, 23, 42, .52) 62%, rgba(15, 23, 42, .38));
      box-shadow: inset 4px 0 0 rgba(226, 232, 240, .72), inset 0 0 34px rgba(226, 232, 240, .07);
    }

    .top-2::after {
      background: radial-gradient(circle at 18% 50%, rgba(226, 232, 240, .12), transparent 34%);
    }

    .top-3 {
      background:
        linear-gradient(90deg, rgba(205, 127, 50, .24), rgba(15, 23, 42, .52) 62%, rgba(15, 23, 42, .38));
      box-shadow: inset 4px 0 0 rgba(205, 127, 50, .74), inset 0 0 34px rgba(205, 127, 50, .07);
    }

    .top-3::after {
      background: radial-gradient(circle at 18% 50%, rgba(205, 127, 50, .13), transparent 34%);
    }

    .top-1 .rank::before { content: "🏅 "; }
    .top-2 .rank::before { content: "🥈 "; }
    .top-3 .rank::before { content: "🥉 "; }

    .top-1 .badge {
      border-color: rgba(255, 215, 0, .48);
      box-shadow: 0 0 26px rgba(255, 215, 0, .18), inset 0 1px 0 rgba(255, 255, 255, .14);
    }

    .footer {
      position: relative;
      z-index: 1;
      margin-top: clamp(22px, 4vw, 48px);
      text-align: center;
      color: rgba(226, 232, 240, .72);
      font-size: clamp(1rem, 3vw, 2.35rem);
      font-weight: 500;
      letter-spacing: .01em;
    }

    .status {
      padding: 24px;
      color: #cbd5e1;
      text-align: center;
      border-bottom: 1px solid rgba(148, 163, 184, .12);
      font-weight: 700;
    }

    .status.error {
      color: #fecaca;
      background: rgba(239, 68, 68, .12);
    }

    @media (max-width:650px) {
      body { padding: 12px 8px; }
      .container { border-radius: 26px; padding: 28px 16px; }
      .table-header,
      .player-row {
        grid-template-columns: 76px minmax(0, 1fr) 118px;
        gap: 9px;
        padding-inline: 14px;
      }
      .table-header { min-height: 58px; }
      .player-row { min-height: 78px; }
    }

    @media (max-width:430px) {
      .container { padding: 24px 10px; }
      .table-header,
      .player-row {
        grid-template-columns: 62px minmax(0, 1fr) 92px;
        gap: 7px;
        padding-inline: 10px;
      }
      .badge { min-width: 82px; padding-inline: 8px; }
    }
  </style>
</head>
<body>
  <div class="container" id="leaderboardCanvas">
    <header class="header">
      <h1>XPRO MEMBER</h1>
      <p id="subtitle">Ranking of the best contributors 🏆🌟✨</p>
    </header>

    <main class="scoreboard">
      <div class="table-header">
        <div>Rank</div>
        <div>Nom</div>
        <div style="text-align:right">Score</div>
      </div>

      <div id="status" class="status">Loading ranking...</div>
      <div id="scoreboardRows"></div>
    </main>

    <div class="footer" id="footer">Official ranking update 📈🏆</div>
  </div>

  <script>
    const DEFAULT_ROSTER_URL = "https://raw.githubusercontent.com/Tahi-Tua/xpro_bot/main/data/memberRankingRoster.json";
    const params = new URLSearchParams(window.location.search);
    const rosterUrl = params.get("roster") || DEFAULT_ROSTER_URL;

    const scoreboardRows = document.getElementById("scoreboardRows");
    const statusBox = document.getElementById("status");
    const subtitle = document.getElementById("subtitle");
    const footer = document.getElementById("footer");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatScore(value) {
      return Number(value || 0).toLocaleString("en-US");
    }

    function getDisplayName(member) {
      return String(
        member.renderName ||
        member.displayName ||
        member.name ||
        member.member ||
        "Unknown"
      ).trim();
    }

    function normalizeMember(member) {
      return {
        name: getDisplayName(member),
        score: Number(member.season || member.score || 0),
      };
    }

    function rowClass(rank) {
      if (rank === 1) return "player-row top-1";
      if (rank === 2) return "player-row top-2";
      if (rank === 3) return "player-row top-3";
      return "player-row";
    }

    function renderRanking(members) {
      const ranking = members
        .map(normalizeMember)
        .filter((member) => member.name)
        .sort((a, b) => b.score - a.score)
        .slice(0, 5);

      statusBox.style.display = "none";
      subtitle.textContent = "Ranking of the best contributors 🏆🌟✨";
      footer.textContent = "Official ranking update 📈🏆";

      scoreboardRows.innerHTML = ranking.map((member, index) => {
        const rank = index + 1;
        return `
          <div class="${rowClass(rank)}">
            <div class="rank">#${rank}</div>
            <div class="name">${escapeHtml(member.name)}</div>
            <div class="score"><span class="badge">${formatScore(member.score)}</span></div>
          </div>
        `;
      }).join("");
    }

    async function loadRanking() {
      try {
        const response = await fetch(`${rosterUrl}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const members = Array.isArray(data) ? data : data.members;

        if (!Array.isArray(members)) {
          throw new Error("Invalid JSON format: members[] not found.");
        }

        renderRanking(members);
      } catch (error) {
        statusBox.classList.add("error");
        statusBox.textContent = `Ranking loading error: ${error.message}`;
      }
    }

    window.__leaderboardReady = loadRanking();
  </script>
</body>
</html>
