<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de Score - XPRO</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(0, 255, 200, 0.25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(120, 80, 255, 0.35), transparent 35%),
        linear-gradient(135deg, #07111f, #0b1020 55%, #111827);
      color: #ffffff;
      padding: 30px 15px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: clamp(2rem, 5vw, 4rem);
      font-weight: 900;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #00f5ff, #7c3aed, #ffcc00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .header p {
      margin-top: 10px;
      color: #cbd5e1;
      font-size: 1rem;
    }

    .scoreboard {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
    }

    .table-header,
    .player-row {
      display: grid;
      grid-template-columns: 100px 1fr 140px;
      align-items: center;
      gap: 10px;
      padding: 16px 24px;
    }

    .table-header {
      background: linear-gradient(90deg, #0f172a, #1e293b);
      color: #94a3b8;
      text-transform: uppercase;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.25);
    }

    .player-row {
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      transition: 0.25s ease;
      position: relative;
    }

    .player-row:hover {
      background: rgba(255, 255, 255, 0.06);
      transform: scale(1.01);
    }

    .player-row:last-child {
      border-bottom: none;
    }

    .rank {
      font-weight: 900;
      font-size: 1.1rem;
      color: #e2e8f0;
    }

    .name {
      font-weight: 700;
      font-size: 1rem;
      color: #f8fafc;
    }

    .score {
      text-align: right;
      font-weight: 900;
      font-size: 1.1rem;
      color: #38bdf8;
    }

    .top-1 {
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.22), transparent);
    }

    .top-2 {
      background: linear-gradient(90deg, rgba(192, 192, 192, 0.18), transparent);
    }

    .top-3 {
      background: linear-gradient(90deg, rgba(205, 127, 50, 0.20), transparent);
    }

    .top-1 .rank::before {
      content: "🥇 ";
    }

    .top-2 .rank::before {
      content: "🥈 ";
    }

    .top-3 .rank::before {
      content: "🥉 ";
    }

    .badge {
      display: inline-block;
      min-width: 42px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      text-align: center;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .status {
      padding: 18px 24px;
      color: #cbd5e1;
      text-align: center;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
    }

    .status.error {
      color: #fecaca;
      background: rgba(239, 68, 68, 0.12);
    }

    @media (max-width: 650px) {
      body {
        padding: 20px 10px;
      }

      .table-header,
      .player-row {
        grid-template-columns: 70px 1fr 90px;
        padding: 14px 14px;
      }

      .table-header {
        font-size: 0.7rem;
      }

      .rank,
      .name,
      .score {
        font-size: 0.9rem;
      }

      .scoreboard {
        border-radius: 18px;
      }
    }

    @media (max-width: 430px) {
      .table-header,
      .player-row {
        grid-template-columns: 60px 1fr 75px;
        gap: 6px;
      }

      .name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .score {
        font-size: 0.85rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header class="header">
      <h1>Tableau de Score</h1>
      <p id="subtitle">Classement officiel des joueurs</p>
    </header>

    <main class="scoreboard">
      <div class="table-header">
        <div>Rank</div>
        <div>Nom</div>
        <div style="text-align:right;">Score</div>
      </div>

      <div id="status" class="status">Chargement du classement...</div>
      <div id="scoreboardRows"></div>
    </main>

    <div class="footer" id="footer">
      Mise à jour du classement
    </div>
  </div>

  <script>
    const ROSTER_URL = "https://raw.githubusercontent.com/Tahi-Tua/xpro_bot/main/data/memberRankingRoster.json";

    const scoreboardRows = document.getElementById("scoreboardRows");
    const statusBox = document.getElementById("status");
    const subtitle = document.getElementById("subtitle");
    const footer = document.getElementById("footer");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatScore(value) {
      return Number(value || 0).toLocaleString("fr-FR");
    }

    function normalizeMember(member) {
      return {
        name: String(member.name || member.displayName || member.member || "Unknown").trim(),
        score: Number(member.season || member.score || 0),
      };
    }

    function rowClass(rank) {
      if (rank === 1) return "player-row top-1";
      if (rank === 2) return "player-row top-2";
      if (rank === 3) return "player-row top-3";
      return "player-row";
    }

    function renderRanking(members) {
      const ranking = members
        .map(normalizeMember)
        .filter((member) => member.name)
        .sort((a, b) => b.score - a.score);

      statusBox.style.display = "none";
      subtitle.textContent = `Classement officiel des ${ranking.length} joueurs`;
      footer.textContent = `Mise à jour du classement • ${ranking.length} joueurs`;

      scoreboardRows.innerHTML = ranking.map((member, index) => {
        const rank = index + 1;
        return `
          <div class="${rowClass(rank)}">
            <div class="rank">#${rank}</div>
            <div class="name">${escapeHtml(member.name)}</div>
            <div class="score"><span class="badge">${formatScore(member.score)}</span></div>
          </div>
        `;
      }).join("");
    }

    async function loadRanking() {
      try {
        const response = await fetch(`${ROSTER_URL}?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const members = Array.isArray(data) ? data : data.members;

        if (!Array.isArray(members)) {
          throw new Error("Format JSON invalide : members[] introuvable.");
        }

        renderRanking(members);
      } catch (error) {
        statusBox.classList.add("error");
        statusBox.textContent = `Erreur chargement classement : ${error.message}`;
      }
    }

    loadRanking();
  </script>
</body>
</html>
